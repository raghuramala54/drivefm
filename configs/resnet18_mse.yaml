# ImageNet-pretrained CNN, fully fine-tuned, deterministic head.
name: resnet18_mse
model:
  backbone: timm:resnet18.a1_in1k
  img_size: [96, 288]
  color: rgb
  pool: proj_flatten
  d_model: 256
  dropout: 0.1
  head: mse
  head_hidden: [256]
  head_act: gelu
train:
  lr: 3.0e-4
  backbone_lr_mult: 0.1
