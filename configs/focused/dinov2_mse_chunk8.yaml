# Control for the head comparison: identical to dinov2_mse except that it predicts 8-step action chunks
# (with temporal ensembling at drive time), exactly like dinov2_flow. Separates "flow head" from "chunking".
name: dinov2_mse_chunk8
data:
  chunk: 8
model:
  backbone: timm:vit_small_patch14_dinov2.lvd142m
  freeze_backbone: true
  img_size: [98, 294]
  color: rgb
  pool: proj_flatten
  d_model: 256
  dropout: 0.1
  head: mse
  head_hidden: [256]
  head_act: gelu
train:
  lr: 3.0e-4
  epochs: 25
