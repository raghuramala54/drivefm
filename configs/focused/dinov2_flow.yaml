# Focused study, cell (frozen foundation model, generative head) = proposed model.
name: dinov2_flow
data:
  chunk: 8
model:
  backbone: timm:vit_small_patch14_dinov2.lvd142m
  freeze_backbone: true
  img_size: [98, 294]
  color: rgb
  pool: proj_flatten
  d_model: 256
  dropout: 0.1
  head: flow
  flow_hidden: 256
  flow_layers: 3
  infer_samples: 16
train:
  lr: 3.0e-4
  epochs: 30
