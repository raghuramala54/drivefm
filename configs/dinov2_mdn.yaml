# Frozen DINOv2 + temporal transformer + mixture-density action chunks.
name: dinov2_mdn
data:
  context_frames: 3
  frame_stride: 2
  chunk: 8
model:
  backbone: timm:vit_small_patch14_dinov2.lvd142m
  freeze_backbone: true
  img_size: [98, 294]
  color: rgb
  pool: proj_flatten
  d_model: 256
  temporal_layers: 2
  dropout: 0.1
  head: mdn
  head_hidden: [256]
  head_act: gelu
  mdn_components: 5
train:
  lr: 3.0e-4
  epochs: 30
