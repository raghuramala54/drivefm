# Proposed method: frozen DINOv2 + temporal transformer + flow-matching action chunks.
name: dinov2_flow
data:
  context_frames: 3
  frame_stride: 2
  chunk: 8
model:
  backbone: timm:vit_small_patch14_dinov2.lvd142m
  freeze_backbone: true
  img_size: [98, 294]
  color: rgb
  pool: proj_flatten
  d_model: 256
  temporal_layers: 2
  dropout: 0.1
  head: flow
  flow_hidden: 256
  flow_layers: 4
  flow_steps: 10
  infer_samples: 16
train:
  lr: 3.0e-4
  epochs: 30
